---
name: Regular base image update check
on:
  schedule:
    - cron: "23 13 3 * *"
  workflow_dispatch:

jobs:
  check_and_rebuild:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ------- 2.4 floating (match build.yml: -py suffix) -------
          - { base_tag: "2.4", python_version: "3.10" }
          - { base_tag: "2.4", python_version: "3.11" }
          - { base_tag: "2.4", python_version: "3.12" }
          # ------- 3.0 / 3.1 (frozen upstream, still rebuild if retagged) -------
          - { base_tag: "3.0", python_version: "3.10" }
          - { base_tag: "3.0", python_version: "3.11" }
          - { base_tag: "3.0", python_version: "3.12" }
          - { base_tag: "3.1", python_version: "3.10" }
          - { base_tag: "3.1", python_version: "3.11" }
          - { base_tag: "3.1", python_version: "3.12" }
          # ------- 3.2 (current 3.x line, includes py3.13) -------
          - { base_tag: "3.2", python_version: "3.10" }
          - { base_tag: "3.2", python_version: "3.11" }
          - { base_tag: "3.2", python_version: "3.12" }
          - { base_tag: "3.2", python_version: "3.13" }
          # ------- Upstream tracking names (published without -py suffix) -------
          - { base_tag: "stable", python_version: "3.12", publish_tag: "stable" }
          - { base_tag: "latest", python_version: "3.12", publish_tag: "latest" }
          # ------- MCP flavor (same bases + requirements-mcp.txt) -------
          - { base_tag: "stable", python_version: "3.12", publish_tag: "stable-mcp", extra_requirements: "requirements-mcp.txt" }
          - { base_tag: "latest", python_version: "3.12", publish_tag: "latest-mcp", extra_requirements: "requirements-mcp.txt" }
          - { base_tag: "3.2", python_version: "3.12", publish_tag: "3.2-py3.12-mcp", extra_requirements: "requirements-mcp.txt" }

    steps:
      - name: Setup image names
        id: names
        shell: bash
        run: |
          set -euo pipefail
          BASE_TAG="${{ matrix.base_tag }}"
          PYTHON_VER="${{ matrix.python_version }}"
          # Dockerfile FROM is always networktocode/nautobot:${BASE_TAG}-py${PYTHON_VER}
          UPSTREAM_TAG="${BASE_TAG}-py${PYTHON_VER}"
          if [[ -n "${{ matrix.publish_tag }}" ]]; then
            PUBLISH_TAG="${{ matrix.publish_tag }}"
          else
            PUBLISH_TAG="${BASE_TAG}-py${PYTHON_VER}"
          fi
          {
            echo "BASE_TAG=$BASE_TAG"
            echo "PYTHON_VER=$PYTHON_VER"
            echo "UPSTREAM_TAG=$UPSTREAM_TAG"
            echo "IMAGE_TAG=bsmeding/nautobot:${PUBLISH_TAG}"
            echo "EXTRA_REQUIREMENTS=${{ matrix.extra_requirements }}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - name: Docker Image Update Checker
        id: baseupdatecheck
        uses: lucacome/docker-image-update-checker@v3.1.2
        with:
          # Compare against the image the Dockerfile actually FROMs
          base-image: networktocode/nautobot:${{ steps.names.outputs.UPSTREAM_TAG }}
          image: ${{ steps.names.outputs.IMAGE_TAG }}

      - name: Set up Docker Buildx
        if: steps.baseupdatecheck.outputs.needs-updating == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU (enable cross-arch emulation)
        if: steps.baseupdatecheck.outputs.needs-updating == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Login to DockerHub
        if: steps.baseupdatecheck.outputs.needs-updating == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.baseupdatecheck.outputs.needs-updating == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=autorebuild-${{ matrix.base_tag }}-py${{ matrix.python_version }}-${{ matrix.publish_tag || 'default' }}
          cache-to: type=gha,mode=max,scope=autorebuild-${{ matrix.base_tag }}-py${{ matrix.python_version }}-${{ matrix.publish_tag || 'default' }}
          build-args: |
            BASE_TAG=${{ steps.names.outputs.BASE_TAG }}
            PYTHON_VER=${{ steps.names.outputs.PYTHON_VER }}
            NAUTOBOT_VER=${{ steps.names.outputs.BASE_TAG }}
            EXTRA_REQUIREMENTS=${{ steps.names.outputs.EXTRA_REQUIREMENTS }}
          tags: ${{ steps.names.outputs.IMAGE_TAG }}
