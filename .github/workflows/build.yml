name: Build & Publish Nautobot

on:
  push:
    branches: [ main ]
    # Skip CI for docs-only / unrelated changes
    paths:
      - "Dockerfile"
      - "Dockerfile.dev"
      - "requirements*.txt"
      - "init-config.sh"
      - ".github/workflows/build.yml"
  schedule:
    # GitHub cron is UTC; this runs daily at 00:17 UTC (~02:17 Amsterdam during CEST)
    # Schedule only rebuilds floating tags (stable/latest); pinned X.Y.Z are immutable.
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Rebuild all matrix images even if the tag already exists"
        type: boolean
        default: false

concurrency:
  group: build-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      # true when Dockerfile / requirements* / init-config change → rebuild ALL pinned tags
      recipe_changed: ${{ steps.paths.outputs.recipe == 'true' || steps.detect.outputs.recipe_changed == 'true' }}
      force_rebuild: ${{ steps.detect.outputs.force_rebuild }}
    steps:
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v7

      # Reliable detection: any requirements/Dockerfile/init change forces full rebuild
      - name: Detect recipe file changes
        id: paths
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            recipe:
              - 'Dockerfile'
              - 'Dockerfile.dev'
              - 'requirements*.txt'
              - 'init-config.sh'

      - name: Detect rebuild policy
        id: detect
        shell: bash
        env:
          FORCE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild || false }}
          PATHS_RECIPE: ${{ steps.paths.outputs.recipe }}
        run: |
          set -euo pipefail

          force=false
          if [[ "$FORCE_INPUT" == "true" ]]; then
            force=true
          fi
          echo "force_rebuild=$force" >> "$GITHUB_OUTPUT"

          # Fallback if paths-filter did not run (non-push) or returned empty
          recipe_changed=false
          if [[ "${PATHS_RECIPE:-}" == "true" ]]; then
            recipe_changed=true
          fi
          echo "recipe_changed=$recipe_changed" >> "$GITHUB_OUTPUT"
          echo "force_rebuild=$force recipe_changed=$recipe_changed (paths-filter=${PATHS_RECIPE:-n/a})"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ------- 1.6 patch builds (also publish "1.6" floating) -------
          # - { version: "1.6.31", python_version: "3.10" }
          # - { version: "1.6.31", python_version: "3.10" }
          # - { version: "1.6.31", python_version: "3.11" }
          # - { version: "1.6.32", python_version: "3.10" }
          # - { version: "1.6.32", python_version: "3.11" }
          # ------- 2.4 patch builds (also publish "2.4" floating) -------
