          - { version: "3.1.5", python_version: "3.11" }
          - { version: "3.1.5", python_version: "3.12" }  
          - { version: "3.1.6", python_version: "3.10" }
          - { version: "3.1.6", python_version: "3.11" }
          - { version: "3.1.6", python_version: "3.12" }  
          - { version: "3.1.7", python_version: "3.10" }
          - { version: "3.1.7", python_version: "3.11" }
          - { version: "3.1.7", python_version: "3.12" }  
          - { version: "3.1.8", python_version: "3.10" }
          - { version: "3.1.8", python_version: "3.11" }
          - { version: "3.1.8", python_version: "3.12" } 
          - { version: "3.2.0", python_version: "3.10" }
          - { version: "3.2.0", python_version: "3.11" }
          - { version: "3.2.0", python_version: "3.12" } 
          - { version: "3.2.1", python_version: "3.10" }
          - { version: "3.2.1", python_version: "3.11" }
          - { version: "3.2.1", python_version: "3.12" } 
          - { version: "3.2.2", python_version: "3.10" }
          - { version: "3.2.2", python_version: "3.11" }
          - { version: "3.2.2", python_version: "3.12" } 
          # ------- Upstream tracking tags (single default Python) -------
          - { version: "stable", python_version: "default" }
          - { version: "latest", python_version: "default" }

    steps:
      - name: Setup Build Info (tags & args)
        shell: bash
        run: |
          BASE_TAG="${{ matrix.version }}"
          PYV="${{ matrix.python_version }}"
          if [[ "$PYV" == "default" ]]; then
            PYTHON_VER="3.12"
            base_tag="bsmeding/nautobot:${BASE_TAG}"
            py_suffix=""
          else
            PYTHON_VER="$PYV"
            base_tag="bsmeding/nautobot:${BASE_TAG}-py${PYTHON_VER}"
            py_suffix="-py${PYTHON_VER}"
          fi

          # Start with the primary tag
          TAGS=("$base_tag")

          # If BASE_TAG is a full patch X.Y.Z, determine if we should add floating X.Y tag
          # Only add floating tag for the highest Python version to avoid overwrites
          # Rule: Use 3.12 if present, otherwise 3.11, otherwise 3.10
          if [[ "$BASE_TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            
            # Set floating tag for the highest Python version in the series
            # Default: use 3.12 for most series, 3.11 for 1.6.x (which doesn't have 3.12)
            if [[ "$PYTHON_VER" == "3.12" ]]; then
              TAGS+=("bsmeding/nautobot:${minor}${py_suffix}")
            elif [[ "$PYTHON_VER" == "3.11" && "$minor" == "1.6" ]]; then
              # 1.6.x series only has 3.10 and 3.11, so use 3.11 for floating tag
              TAGS+=("bsmeding/nautobot:${minor}${py_suffix}")
            fi
            # If you also want "2.4-latest" style, uncomment next line:
            # TAGS+=("bsmeding/nautobot:${minor}-latest${py_suffix}")
          fi

          {
            echo "BASE_TAG=$BASE_TAG"
            echo "PYTHON_VER=$PYTHON_VER"
            echo "PRIMARY_TAG=$base_tag"
            echo "TAGS<<EOF"
            printf "%s\n" "${TAGS[@]}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Decide whether to build
        id: should_build
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_REBUILD: ${{ needs.prepare.outputs.force_rebuild }}
          RECIPE_CHANGED: ${{ needs.prepare.outputs.recipe_changed }}
        run: |
          set -euo pipefail

          floating=false
          if [[ "${{ env.BASE_TAG }}" == "stable" || "${{ env.BASE_TAG }}" == "latest" ]]; then
            floating=true
          fi

          # Daily schedule: only refresh floating tags (pinned X.Y.Z are immutable upstream)
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            if [[ "$floating" == "true" ]]; then
              echo "reason=schedule-floating"
              echo "build=true" >> "$GITHUB_OUTPUT"
            else
              echo "reason=schedule-skip-pinned"
              echo "build=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # Manual force rebuild
          if [[ "$FORCE_REBUILD" == "true" ]]; then
            echo "reason=force-rebuild"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Floating tags always rebuild on push/dispatch (upstream moves)
          if [[ "$floating" == "true" ]]; then
            echo "reason=floating-tag"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Recipe changed → rebuild all pinned versions so packages/Dockerfile updates land everywhere
          if [[ "$RECIPE_CHANGED" == "true" ]]; then
            echo "reason=recipe-changed"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Typical case: you only added a new upstream version → build only missing tags
          if docker manifest inspect "${{ env.PRIMARY_TAG }}" >/dev/null 2>&1; then
            echo "reason=tag-exists-skip (${{ env.PRIMARY_TAG }})"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "reason=tag-missing-build (${{ env.PRIMARY_TAG }})"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Debug Info
        run: |
          echo "Upstream base tag (BASE_TAG): ${{ env.BASE_TAG }}"
          echo "Python version (PYTHON_VER):  ${{ env.PYTHON_VER }}"
          echo "Primary tag: ${{ env.PRIMARY_TAG }}"
          echo "Will build: ${{ steps.should_build.outputs.build }}"
          echo "Will push tags:"
          echo "${{ env.TAGS }}"

      - name: Checkout
        if: steps.should_build.outputs.build == 'true'
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        if: steps.should_build.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU (enable cross-arch emulation)
        if: steps.should_build.outputs.build == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Login to Docker Hub
        if: steps.should_build.outputs.build == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Update Docker Hub description once per workflow (avoid doing it for every matrix job)
      - name: Docker Hub Description
        if: >
          steps.should_build.outputs.build == 'true' &&
          matrix.version == 'latest' &&
          matrix.python_version == 'default'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: bsmeding/nautobot

      - name: Build and Push Docker Image
        if: steps.should_build.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          pull: true
          # Cold cache only for moving tags; pinned X.Y.Z reuse BuildKit/GHA cache
          no-cache: ${{ matrix.version == 'stable' || matrix.version == 'latest' }}
          cache-from: type=gha,scope=nautobot-${{ env.BASE_TAG }}-py${{ env.PYTHON_VER }}
          cache-to: type=gha,mode=max,scope=nautobot-${{ env.BASE_TAG }}-py${{ env.PYTHON_VER }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE_TAG=${{ env.BASE_TAG }}
            PYTHON_VER=${{ env.PYTHON_VER }}
            NAUTOBOT_VER=${{ env.BASE_TAG }}
          tags: ${{ env.TAGS }}
