          - { version: "2.4.35", python_version: "3.11" }
          - { version: "2.4.35", python_version: "3.12" }
          - { version: "2.4.36", python_version: "3.10" }
          - { version: "2.4.36", python_version: "3.11" }
          - { version: "2.4.36", python_version: "3.12" }
